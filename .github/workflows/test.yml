name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lizon
          POSTGRES_PASSWORD: lizon
          POSTGRES_DB: lizon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lizon -d lizon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://lizon:lizon@localhost:5432/lizon
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @lizon/shared
      - run: npm run db:generate -w @lizon/api
      - run: npm run db:migrate -w @lizon/api
      - run: npm test
