services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lizon
      POSTGRES_PASSWORD: lizon
      POSTGRES_DB: lizon
    ports:
      - "5432:5432"
    volumes:
      - lizon-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lizon -d lizon"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://lizon:lizon@postgres:5432/lizon
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      COOKIE_SECURE: "false"
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/apps/api/data/uploads
      SEED_ON_BOOT: "false"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - lizon-uploads:/app/apps/api/data/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  lizon-pg:
  lizon-uploads:
